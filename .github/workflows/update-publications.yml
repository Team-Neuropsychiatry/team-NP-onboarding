name: Update publications from ORCID

on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust as you like: https://crontab.guru
    - cron: "0 6 * * 1"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch publications from ORCID
        run: python scripts/fetch_publications.py

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          if git diff --staged --quiet; then
            echo "No changes to publications data."
          else
            git commit -m "Auto-update publications from ORCID"
            git push
          fi
