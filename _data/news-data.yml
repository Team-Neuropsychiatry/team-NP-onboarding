  news:
  - title: "Two finished clinical trials: T-BIDE and D-DOTT"
    date: 28-08-2026
    image: assets/photos/news/T-BIDE_D-DOTT_borrel.jpeg
    text: > 
      We celebrated two important milestones in one go: team T-BIDE and team D-DOTT finished their intensive trials after several years of inclusion.
      The findings will be presented for the first time in Naples in October, during the 7th European Conference on Brain Stimulation in Mental Health.

  - title: "MALIBU Study Reaches 1/3rd of Participants"
    date: 01-09-2026
    image: assets/photos/news/Celine_malibu_news.jpg
    text: >
      Malibu is now past 1/3 of the intended number of inclusions (target = 66).
      We presented a poster of the Malibu protocol at the ISLC-PAIS congress last
      week. For more information on the project, visit our website.
    link: "https://hersenstimulatie-longcovid.nl"
